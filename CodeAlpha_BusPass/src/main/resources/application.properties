spring.application.name=buspass
server.port=${SERVER_PORT:8082}

spring.datasource.url=jdbc:h2:file:${user.home}/buspassdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

integration.removal.enabled=${REMOVAL_INTEGRATION_ENABLED:true}
integration.removal.base-url=${REMOVAL_BASE_URL:http://localhost:8081/api/records}

spring.application.name=buspass
server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:h2:file:${user.home}/buspassdb;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

integration.removal.enabled=${REMOVAL_INTEGRATION_ENABLED:true}
integration.removal.base-url=${REMOVAL_BASE_URL:http://localhost:8081/api/records}
integration.removal.retry-delay-ms=${REMOVAL_RETRY_DELAY_MS:30000}

ticket.signing-secret=${TICKET_SIGNING_SECRET:}

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Assistant Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="chat">
    <h1>Cloud Project Chatbot</h1>
    <div id="messages"></div>
    <div class="suggestions" id="suggestions"></div>
    <form id="chat-form">
      <input id="text" placeholder="Type a message or tap a suggestion above" required>
      <button type="submit">Send</button>
    </form>
  </section>

  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const textInput = document.getElementById("text");

    const suggestions = [
      "show routes", "book a ticket", "server scale status", "show redundancy records", "help"
    ];

    function appendMessage(role, text) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function renderSuggestions() {
      const container = document.getElementById("suggestions");
      container.innerHTML = "";
      suggestions.forEach(cmd => {
        const btn = document.createElement("button");
        btn.textContent = cmd;
        btn.addEventListener("click", () => sendMessage(cmd));
        container.appendChild(btn);
      });
    }

    async function sendMessage(text) {
      if (!text.trim()) return;
      appendMessage("user", text);
      textInput.value = "";
      renderSuggestions();
      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await response.json();
        appendMessage("bot", `[${data.intent}] ${data.response}`);
      } catch {
        appendMessage("bot", "Chat service error. Please try again.");
      }
    }

    appendMessage("bot", "Hello! Tap a suggestion below or type a message.");
    renderSuggestions();

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage(textInput.value.trim());
    });
  </script>
</body>
</html>

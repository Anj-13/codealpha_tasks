spring.application.name=removalsystem
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:sqlite:${user.home}/removalsystem.db}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite has a single writer. One connection serialises each check-then-insert transaction,
# so two concurrent submissions cannot both pass the duplicate checks.
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false
app.seed.enabled=true
app.admin-key=${ADMIN_API_KEY:}
